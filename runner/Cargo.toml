[package]
name = "libstress"
description = "Professional-grade system stress testing CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "libstress"
path = "src/main.rs"

[features]
default = ["extras"]
extras = ["dep:net-stress", "dep:sched-stress"]
gpu = ["wgpu", "pollster"]
full = ["extras", "gpu"]

[dependencies]
stress-core.workspace = true
cpu-stress.workspace = true
mem-stress.workspace = true
io-stress.workspace = true
compile-stress.workspace = true
net-stress = { workspace = true, optional = true }
sched-stress = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
humantime.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
